# Role Mapping Configuration
# Maps groups to application roles

role_mapping:
  # Direct mappings from group names to application roles
  "administrators":
    - "admin"
    - "manager"

  "developers":
    - "developer"
    - "viewer"

  "users":
    - "viewer"

  # Pattern-based mapping (optional)
  # Matches group names using regex patterns
  patterns:
    - pattern: ".*admin.*"
      roles: ["admin"]
    - pattern: ".*Admin.*"
      roles: ["admin"]
    - pattern: ".*manager.*"
      roles: ["manager", "viewer"]
    - pattern: ".*Manager.*"
      roles: ["manager", "viewer"]
    - pattern: ".*developer.*"
      roles: ["developer", "viewer"]
    - pattern: ".*Developer.*"
      roles: ["developer", "viewer"]

  # Default roles for users not in any mapped group
  default:
    - "viewer"
