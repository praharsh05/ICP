# LDAP Configuration Example
# Copy this file and customize for your LDAP server

ldap:
  # Server Configuration
  server:
    host: "ldap.example.com"
    port: 389                    # Use 636 for LDAPS
    use_ssl: false               # true for LDAPS
    use_tls: true                # StartTLS
    validate_cert: true          # Validate SSL certificate
    timeout: 10                  # Connection timeout in seconds
    
  # Bind Credentials (use environment variables in production)
  bind:
    dn: "cn=admin,dc=example,dc=com"
    password: "${LDAP_BIND_PASSWORD}"  # Set in .env file
    
  # Search Configuration
  search:
    base_dn: "dc=example,dc=com"
    user_search_base: "ou=Users,dc=example,dc=com"
    user_filter: "(objectClass=person)"
    group_search_base: "ou=Groups,dc=example,dc=com"
    
  # Attribute Mapping
  # Adjust these based on your LDAP server type
  attributes:
    username: "sAMAccountName"      # For AD: "sAMAccountName", For OpenLDAP: "uid"
    email: "mail"
    first_name: "givenName"
    last_name: "sn"
    display_name: "displayName"
    groups: "memberOf"
    
  # User Import Configuration
  sync:
    enabled: true
    interval_hours: 24            # How often to sync
    batch_size: 100               # Users per batch
    
  # Role Mapping
  # Map LDAP groups to application roles
  role_mapping:
    "CN=Admins,OU=Groups,DC=example,DC=com": ["admin"]
    "CN=Managers,OU=Groups,DC=example,DC=com": ["manager", "viewer"]
    "CN=Viewers,OU=Groups,DC=example,DC=com": ["viewer"]
    default: ["viewer"]            # Default role for all users







