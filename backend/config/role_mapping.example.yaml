# Role Mapping Configuration
# Maps groups to application roles

role_mapping:
  # Example: Map group name to application roles
  "System Administrators":
    - "admin"
    - "manager"

  "Department Managers":
    - "manager"
    - "viewer"

  "Regular Users":
    - "viewer"

  # Pattern-based mapping (optional)
  patterns:
    - pattern: ".*Admin.*"
      roles: ["admin"]
    - pattern: ".*Manager.*"
      roles: ["manager", "viewer"]

  # Default roles for users not in any mapped group
  default:
    - "viewer"
