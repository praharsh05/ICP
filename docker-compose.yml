version: '3.8'

services:
  # ── Local Keycloak (dev/testing only) ──────────────────────────────
  # Only starts when you run: docker compose --profile keycloak up -d
  # For external Keycloak, skip this and set KEYCLOAK_URL in backend env.
  keycloak:
    image: quay.io/keycloak/keycloak:24.0
    container_name: icp-keycloak
    profiles:
      - keycloak
    ports:
      - "8080:8080"
    environment:
      - KEYCLOAK_ADMIN=admin
      - KEYCLOAK_ADMIN_PASSWORD=admin
      - KC_DB=dev-mem
      - KC_HTTP_ENABLED=true
      - KC_HOSTNAME_STRICT=false
      - KC_HOSTNAME_STRICT_HTTPS=false
      - KC_LOG_LEVEL=info
    command: start-dev --import-realm
    volumes:
      - ./keycloak:/opt/keycloak/data/import
    healthcheck:
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/localhost/8080 && echo -e 'GET /realms/icp HTTP/1.0\\r\\nHost: localhost\\r\\n\\r\\n' >&3 && head -1 <&3 | grep -q '200'"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 60s
    networks:
      - icp-network

  neo4j:
    image: neo4j:5.13
    container_name: icp-neo4j
    ports:
      - "7474:7474"  # HTTP
      - "7687:7687"  # Bolt
    environment:
      - NEO4J_AUTH=neo4j/password
      - NEO4J_server_memory_heap_max__size=2G
      - NEO4J_PLUGINS=["apoc"]
    volumes:
      - neo4j_data:/data
      - neo4j_logs:/logs
    healthcheck:
      test: ["CMD", "cypher-shell", "-u", "neo4j", "-p", "password", "RETURN 1"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - icp-network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: icp-backend
    ports:
      - "8000:8000"
    environment:
      - NEO4J_URI=bolt://neo4j:7687
      - NEO4J_USER=neo4j
      - NEO4J_PASSWORD=password
      - NEO4J_DB=neo4j
      # Auth provider: "local" or "keycloak"
      - AUTH_PROVIDER=local
      # Keycloak settings (only used when AUTH_PROVIDER=keycloak)
      # Point to external Keycloak URL when integrating with an existing instance
      - KEYCLOAK_URL=http://keycloak:8080
      - KEYCLOAK_REALM=icp
      - KEYCLOAK_CLIENT_ID=icp-frontend
    volumes:
      - ./backend:/app
    networks:
      - icp-network
    depends_on:
      neo4j:
        condition: service_healthy
    command: uvicorn mock_api:app --host 0.0.0.0 --port 8000 --reload

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    container_name: icp-frontend
    ports:
      - "6693:6693"
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8000
    volumes:
      - ./frontend:/app
      - /app/node_modules
      - /app/.next
    depends_on:
      - backend
    networks:
      - icp-network
    command: npm run dev

networks:
  icp-network:
    driver: bridge

volumes:
  neo4j_data:
  neo4j_logs:
